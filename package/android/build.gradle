import java.nio.file.Paths
import com.android.Version

def agpVersion = Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
def androidManifestPath = agpVersion >= 7 ? 'src/main/AndroidManifest.xml' : 'src/hasNamespace/AndroidManifest.xml'

buildscript {
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["VisionCamera_kotlinVersion"]

  repositories {
    maven {
      url "https://plugins.gradle.org/m2/"
    }
    mavenCentral()
    google()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2" // Ensure this matches your project's AGP version
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def resolveBuildType() {
    Gradle gradle = getGradle()
    String tskReqStr = gradle.getStartParameter().getTaskRequests()["args"].toString()

    return tskReqStr.contains("Release") ? "release" : "debug"
}

def isNewArchitectureEnabled() {
  return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}
apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def safeExtGetBool(prop, fallback) {
  Boolean.parseBoolean("${safeExtGet(prop, fallback)}")
}

def reactNativeArchitectures() {
  def value = project.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

static def findNodeModules(baseDir) {
  def basePath = baseDir.toPath().normalize()
  while (basePath) {
    def nodeModulesPath = Paths.get(basePath.toString(), "node_modules")
    def reactNativePath = Paths.get(nodeModulesPath.toString(), "react-native")
    if (nodeModulesPath.toFile().exists() && reactNativePath.toFile().exists()) {
      return nodeModulesPath.toString()
    }
    basePath = basePath.getParent()
  }
  throw new GradleException("react-native-vision-camera: Failed to find node_modules/ path!")
}

logger.warn("[VisionCamera] Thank you for using VisionCamera ❤️")
logger.warn("[VisionCamera] If you enjoy using VisionCamera, please consider sponsoring this project: https://github.com/sponsors/mrousavy")

def nodeModules = findNodeModules(projectDir)
logger.warn("[VisionCamera] node_modules found at $nodeModules")
def reactNativeDir = Paths.get(nodeModules.toString(), "react-native").toString()

def enableFrameProcessors = safeExtGetBool('VisionCamera_enableFrameProcessors', true)
logger.warn("[VisionCamera] VisionCamera_enableFrameProcessors: $enableFrameProcessors")


android {
  compileSdkVersion safeExtGet('compileSdkVersion', 34)
  namespace = "com.visioncamera"

  sourceSets {
    main {
      manifest.srcFile androidManifestPath
      if (agpVersion < 7) {
        java {
          srcDirs += ['src/main/java', 'src/hasNamespace/java']
        }
      }
    }
  }

  defaultConfig {
    minSdkVersion safeExtGet('minSdkVersion', 26)
    targetSdkVersion safeExtGet('targetSdkVersion', 34)
    buildConfigField "boolean", "ENABLE_FRAME_PROCESSORS", enableFrameProcessors.toString()

    ndk {
      abiFilters(*reactNativeArchitectures())
    }
  }

  buildTypes {
    debug {
      // No special signing config for debug
      externalNativeBuild {
        cmake {
           cppFlags "-O0 -frtti -fexceptions -Wall -Wno-unused-variable -fstack-protector-all" // Example: Debug specific flags
           arguments.clear() // Ensure no carry-over
           arguments "-DNODE_MODULES_DIR=$nodeModules",
                     "-DREACT_NATIVE_DIR=$reactNativeDir",
                     "-DJS_RUNTIME=jsc", // Override to JSC for debug
                     "-DENABLE_FRAME_PROCESSORS=${enableFrameProcessors ? 'ON' : 'OFF'}"
                     // No HERMES_ENGINE_DIR needed for JSC
        }
      }
    }
    release {
      minifyEnabled false
      // Signing configs, ProGuard rules, etc., would go here for a release build.
      externalNativeBuild {         // <-- ADD/MODIFY THIS BLOCK
        cmake {                     // <-- ADD/MODIFY THIS BLOCK
           cppFlags "-O2 -frtti -fexceptions -Wall -Wno-unused-variable -fstack-protector-all" // Example: Release specific flags
           arguments.clear()        // <-- ADD/MODIFY THIS BLOCK
           arguments "-DNODE_MODULES_DIR=$nodeModules",                     // <-- ADD/MODIFY THIS BLOCK
                     "-DREACT_NATIVE_DIR=$reactNativeDir",                  // <-- ADD/MODIFY THIS BLOCK
                     "-DJS_RUNTIME=hermes",                                 // <-- ADD/MODIFY THIS BLOCK
                     "-DENABLE_FRAME_PROCESSORS=${enableFrameProcessors ? 'ON' : 'OFF'}",          // <-- ADD/MODIFY THIS BLOCK
                     "-Dhermes-engine_DIR=${reactNativeDir}/ReactAndroid/hermes-engine/build/hermes/" // <-- ADD/MODIFY THIS BLOCK
        }                           // <-- ADD/MODIFY THIS BLOCK
      }                             // <-- ADD/MODIFY THIS BLOCK
    }
  }

  packagingOptions {
    pickFirst 'lib/x86/libjsi.so'
    pickFirst 'lib/x86_64/libjsi.so'
    pickFirst 'lib/armeabi-v7a/libjsi.so'
    pickFirst 'lib/arm64-v8a/libjsi.so'

    pickFirst 'lib/x86/libreact_nativemodule_core.so'
    pickFirst 'lib/x86_64/libreact_nativemodule_core.so'
    pickFirst 'lib/armeabi-v7a/libreact_nativemodule_core.so'
    pickFirst 'lib/arm64-v8a/libreact_nativemodule_core.so'
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
      version "3.22.1" // Ensure this matches your project's CMake version
    }
  }
  lintOptions {
    abortOnError false
  }

  if (isNewArchitectureEnabled()) {
    sourceSets {
      main {
        java.srcDirs += ["src/newarch"]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = safeExtGet('kotlinVersion', project.properties['VisionCamera_kotlinVersion'])

dependencies {
  api "com.facebook.react:react-android"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"

  def camerax_version = project.properties["VisionCamera_cameraxVersion"]
  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-video:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  implementation "androidx.camera:camera-extensions:${camerax_version}"

  // ML Kit for Barcode Scanning (if applicable)
  implementation "com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.0"

  // Java utility for converting YUV to RGB
  // https://developer.android.com/reference/android/renderscript/ScriptIntrinsicYuvToRGB
  // implementation "androidx.renderscript:renderscript-toolkit:1.0.0" // <-- COMMENTED OUT

  implementation files("$nodeModules/react-native/ReactAndroid/src/main/jni/first-party/fbjni/jni.h")
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "VisionCamera"
    codegenJavaPackageName = "com.visioncamera"
  }
}